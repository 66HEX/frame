[package]
name = "frame-app"
version = "0.33.1"
edition = "2024"
authors = ["Marek Jozwiak <hexthecoder@gmail.com>"]
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[[bin]]
name = "frame"
path = "src/main.rs"

[dependencies]
cpal = "0.18.1"
directories = "6.0.0"
frame-core = { path = "../frame-core" }
frame-updater = { path = "../frame-updater" }
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "bc577476a0eb55173ef985585cfb487f75ab1cab" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "bc577476a0eb55173ef985585cfb487f75ab1cab", features = ["font-kit", "wayland", "x11"] }
image = "0.25.10"
notify-rust = "4.18.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.27"
smallvec = "1.15.1"
sysinfo = "0.31.4"
thiserror = "2.0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.12", default-features = false, features = ["async-io", "notification", "settings"] }
smol = "2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6"

[dev-dependencies]
csscolorparser = "0.9.0"
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "bc577476a0eb55173ef985585cfb487f75ab1cab", features = ["test-support"] }

[build-dependencies]
csscolorparser = "0.9.0"
embed-resource = "3.0.9"
image = "0.25.10"
serde_json = "1.0.150"

[package.metadata.bundle]
name = "Frame"
identifier = "Frame"
icon = ["resources/app-icons/icon.png"]
resources = ["resources/binaries"]
osx_minimum_system_version = "10.15.7"

[lints]
workspace = true
