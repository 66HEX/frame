[package]
name = "gpui_ce_elements"
version = "0.1.0"
description.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["gpui"]

[dependencies]
derive_setters.workspace = true
gpui.workspace = true
unicode-segmentation.workspace = true
palette.workspace = true
smallvec.workspace = true

[dev-dependencies]
gpui_parley.workspace = true
gpui = { path = "../gpui", package = "gpui-ce", features = ["test-support"] }
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
gpui_fonts = { path = "../gpui_ce_fonts", version = "0.2.2", package = "gpui-ce-fonts" }

[[example]]
name = "editable_text"
path = "examples/editable_text.rs"

[[example]]
name = "switch"
path = "examples/switch.rs"
