[package]
name = "gpui_ce_windows"
version = "0.1.0"
description.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_windows.rs"

[features]
default = ["gpui/default"]
test-support = ["gpui/test-support"]
screen-capture = ["gpui/screen-capture"]

[dependencies]
gpui = { path = "../gpui", version = "0.2.2", package = "gpui-ce", default-features = false }
gpui_render.workspace = true
wgsl-rs.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
accesskit.workspace = true
accesskit_windows.workspace = true
anyhow.workspace = true
collections.workspace = true
dunce.workspace = true
etagere.workspace = true
futures.workspace = true
gpui_util.workspace = true
gpui_parley = { workspace = true, features = ["system-fonts"] }
image.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
uuid.workspace = true
windows.workspace = true
windows-061 = { workspace = true, features = ["Win32_Graphics_Direct3D11"] }
windows-core.workspace = true
windows-numerics = "0.3"
windows-registry = "0.6.1"

[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui_fonts = { path = "../gpui_ce_fonts", version = "0.2.2", package = "gpui-ce-fonts" }
