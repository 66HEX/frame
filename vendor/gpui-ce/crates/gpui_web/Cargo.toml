[package]
name = "gpui_ce_web"
version = "0.1.0"
description.workspace = true
publish.workspace = true
edition.workspace = true
license = "Apache-2.0"
autoexamples = false

[lints]
workspace = true

[features]
default = ["multithreaded"]
multithreaded = ["dep:wasm_thread", "scheduler/wasm-threads"]

[lib]
path = "src/gpui_web.rs"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui.workspace = true
gpui_parley.workspace = true
scheduler.workspace = true
parking_lot = { workspace = true, features = ["nightly"] }
gpui_wgpu.workspace = true
http.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
uuid.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-time.workspace = true
console_error_panic_hook.workspace = true
js-sys.workspace = true
raw-window-handle.workspace = true
# The crates.io release contains the current wasm-bindgen-compatible worker
# bootstrap, so consumers do not need a Git dependency.
wasm_thread = { version = "0.3.3", features = ["es_modules"], optional = true }
web-sys = { version = "0.3", features = [
  "console",
  "Blob",
  "Clipboard",
  "ClipboardEvent",
  "ClipboardItem",
  "CompositionEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "Document",
  "DomRect",
  "DragEvent",
  "Element",
  "EventTarget",
  "File",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlTextAreaElement",
  "IdleDeadline",
  "IdleRequestOptions",
  "InputEvent",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MediaQueryListEvent",
  "MouseEvent",
  "Navigator",
  "PointerEvent",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "ReadableStreamReadResult",
  "ResizeObserver",
  "ResizeObserverBoxOptions",
  "ResizeObserverEntry",
  "ResizeObserverSize",
  "ResizeObserverOptions",
  "Screen",
  "Storage",
  "VisualViewport",
  "Headers",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "RequestRedirect",
  "Response",
  "WheelEvent",
  "Window",
] }

[package.metadata.cargo-shear]
ignored = ["scheduler"]
