labels: ["needs-confirmation"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Please readn through the bug reporting section of the [CONTRIBUTING document](https://github.com/gpui-ce/gpui-ce/blob/main/CONTRIBUTING.md#i-have-a-bug--something-isnt-working).
        > Use these links to review the existing [Issue Triage Discussions](https://github.com/gpui-ce/gpui-ce/discussions/categories/issue-triage?discussions_q=category%3A%22Issue+Triage%22+) and [Bug Issues](https://github.com/gpui-ce/gpui-ce/issues?q=sort%3Aupdated-desc+label%3Abug).
  - type: markdown
    attributes:
      value: "# Issue Details"
  - type: textarea
    attributes:
      label: Issue Description
      description: |
        Provide a detailed description of the issue.  Include relevant information, such as:
        - The feature or configuration option you encounter the issue with.
        - Screenshots, screen recordings, or other supporting media (as needed).
        - If this is a regression of an existing issue that was closed or resolved, please include the previous item reference (Discussion, Issue, PR, commit) in your description.
      # > [!TIP]
      # > **Not sure what information to include?**
      # > Here are some recommendations:
      # > - **Input issues:** include your keyboard layout, a screenshot of logged keystrokes from the terminal inspector's "Keyboard" tab (Linux: <kbd>ctrl</kbd>+<kbd>shift</kbd>+<kbd>i</kbd>; MacOS: <kbd>cmd</kbd>+<kbd>alt</kbd>+<kbd>i</kbd>), input method, Linux input method engine (IBus, Fcitx 5, or none) and its version.
      # > - **Font issues:** include the problematic character(s), the output of `ghostty +show-face` for these character(s), and if they work in other applications.
      # > - **Terminal emulation issues (including image rendering issues):** attach an [asciinema](https://docs.asciinema.org/getting-started/) cast file, shell script, or text file for reproduction.
      # > - **Renderer issues:** (Linux) include your OpenGL version, graphics card, driver version.
      # > - **Crashes:** (macOS) include the [Sentry UUID](https://github.com/ghostty-org/ghostty?tab=readme-ov-file#crash-reports); (Linux) try to reproduce using a debug build and provide the stack trace.
      placeholder: |
        When using the editable text area element in its default configuration, text is always drawn in left-to-right order even when the script is exclusively oriented right-to-left.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: |
        Describe how you expect gpui-ce to behave in this situation. Include any relevant documentation links.
      placeholder: |
        Editable text element displays text in right-to-left format when typing in right-to-left oriented scripts.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual Behavior
      description: |
        Describe how gpui-ce actually behaves in this situation. If it is not immediately obvious how the actual behavior differs from the expected behavior described above, please be sure to mention the deviation specifically.
      placeholder: |
        Editable text element displays text in left-to-right order even if the script is exclusively oriented right-to-left.
    validations:
      required: true
  #- type: textarea
  #  attributes:
  #    label: Reproduction Steps
  #    description: |
  #      Provide a detailed set of step-by-step instructions for reproducing this issue.
  #    placeholder: |
  #      1. Open Ghostty.
  #      2. Connect to a remote server via SSH.
  #      3. Try to execute `clear`.
  #      4. Observe `xterm-ghostty` error message above.
  #  validations:
  #    required: true
  #- type: textarea
  #  attributes:
  #    label: Ghostty Logs
  #    description: |
  #      Provide any captured Ghostty logs or stacktraces during your issue reproduction in this field.  On Linux, logs can be found by running `ghostty` from the command-line; on macOS, logs can be viewed with `sudo log stream --level debug --predicate 'subsystem=="com.mitchellh.ghostty"'` from another terminal emulator.
  #    render: text
  - type: textarea
    attributes:
      label: Crate Versions
      description: Paste your gpui dependencies from your Cargo.toml here (and any dependencies you've patched)
      placeholder: |
        ```
        gpui = { version = 0.3, features = ["inspector"], package = "gpui_ce" }
        gpui_platform = { version = 0.3, package = "gpui_ce_platform" }
        gpui_elements = { version = 0.3, package = "gpui_ce_elements" }
        ```
      render: text
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Platform
      description: |
        Please identify the platforms you have tested this issue against.
      options:
        - label: Linux
        - label: Windows
        - label: MacOS
        - label: Web
        - label: Android
        - label: iOS
        - label: Other
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Platform Details
      description: |
        If you know which subdomains were active while testing, please identify them here
      options:
        - label: (Linux) x11
        - label: (Linux) Wayland
        - label: (Linux) GNOME
