body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > This form is for **first-time contributors** who need to be vouched before submitting pull requests. Please read the [Contributing Guide](https://github.com/gpui-ce/gpui-ce/blob/main/CONTRIBUTING.md) and [genAI/LLM Policy](https://github.com/gpui-ce/gpui-ce/blob/main/AI_POLICY.md) before submitting.
        >
        > Keep your request **concise** and write it **in your own voice** — do not generate this via genAI/LLMs. A maintainer will comment `!vouch` if your request is approved, which will add you to the list of vouched users and will allow you to open a pull request.
  - type: textarea
    attributes:
      label: What do you want to change?
      description: |
        Describe the change you'd like to make. If there is an existing issue or discussion, link to it.
      placeholder: |
        I'd like to fix the rendering issue described in #1234 where...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why do you want to make this change?
      description: |
        Explain your motivation. Why is this change important or useful?
      placeholder: |
        This bug affects users who...
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: "I acknowledge that:"
      options:
        - label: >-
            I have read the [Contributing Guide](https://github.com/gpui-ce/gpui-ce/blob/main/CONTRIBUTING.md) and understand the contribution process.
          required: true
        - label: >-
            I have read and agree to follow the [genAI/LLM Policy](https://github.com/gpui-ce/gpui-ce/blob/main/AI_POLICY.md).
          required: true
        - label: >-
            I wrote this vouch request myself, in my own voice, without using genAI/LLMs to generate it.
          required: true
