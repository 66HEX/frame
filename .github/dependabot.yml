version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    ignore:
      # windows 0.62.2 still requires windows-core 0.62; revisit with a compatible windows release.
      - dependency-name: windows-core
        versions: ["0.100.x"]
    groups:
      accesskit:
        patterns:
          - "accesskit*"
      windows-rs:
        patterns:
          - windows
          - windows-core
          - windows-numerics
      rust-patch-updates:
        update-types:
          - patch
    commit-message:
      prefix: "deps(cargo)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    commit-message:
      prefix: "deps(actions)"
