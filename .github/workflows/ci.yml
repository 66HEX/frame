# Generated from xtask::workflows::ci
# Rebuild with `cargo xtask workflows`.
name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cargo_xtask_ci:
    name: cargo xtask ci
    runs-on: ubuntu-22.04
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: steps::setup_rust
      shell: bash
      run: |
        rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
        rustup default 1.95.0
        test "$(rustc --version | awk '{print $2}')" = "1.95.0"
    - name: steps::setup_linux
      run: |
        ubuntu_archive='https://archive.ubuntu.com/ubuntu'
        if ! getent ahosts archive.ubuntu.com >/dev/null; then
          ubuntu_archive='https://mirrors.edge.kernel.org/ubuntu'
        fi
        echo "Using Ubuntu archive: $ubuntu_archive"
        sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -E -i "s|mirror\+file:/etc/apt/apt-mirrors\.txt|${ubuntu_archive}/|g;s|https?://(azure\.)?archive\.ubuntu\.com/ubuntu|${ubuntu_archive}|g" {} +
        sudo apt-get update
        sudo apt-get install -y clang desktop-file-utils libasound2-dev libdrm-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config
    - name: steps::restore_sdk_cache
      id: sdk-cache
      if: runner.os == 'macOS'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/media-sdk/archives
        key: libav-macos-${{ runner.arch }}-${{ hashFiles('packaging/media/**', 'script/media-worker.py') }}
        restore-keys: libav-macos-${{ runner.arch }}-
    - name: ci::setup_media_sdk
      run: python script/media-worker.py setup-ci
    - name: ci::save_sdk_cache
      if: runner.os == 'macOS' && steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/media-sdk/archives
        key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
    - name: ci::build_media_worker
      run: cargo build --locked --package frame-media
    - name: ci::test_media_worker
      run: cargo test --locked --package frame-media
    - name: ci::build_app_qa
      run: cargo build --locked --package frame-app --features qa-harness --bin frame-qa
    - name: ci::test_worker_packaging
      env:
        FRAME_TEST_QA_RELOCATION: '1'
      run: python -B -m unittest discover -s script/tests -p test_media_worker.py -v
    - name: security::validate_workflow_syntax
      run: |
        mkdir -p target/actionlint
        curl --fail --location --proto '=https' --tlsv1.2 \
          --output target/actionlint/actionlint.tar.gz \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  target/actionlint/actionlint.tar.gz' | sha256sum --check --strict
        tar --extract --gzip --file target/actionlint/actionlint.tar.gz --directory target/actionlint actionlint
        target/actionlint/actionlint -color
    - name: security::install_cargo_deny
      run: cargo install cargo-deny --version 0.20.2 --locked
    - name: security::cargo_deny
      run: cargo deny check
    - name: security::install_cargo_audit
      run: cargo install cargo-audit --version 0.22.2 --locked
    - name: security::cargo_audit
      run: |
        cargo audit --deny unmaintained --deny unsound --no-yanked \
          --ignore RUSTSEC-2024-0384 \
          --ignore RUSTSEC-2024-0436 \
          --ignore RUSTSEC-2026-0192 \
          --ignore RUSTSEC-2026-0194 \
          --ignore RUSTSEC-2026-0195 \
          --ignore RUSTSEC-2026-0206 \
          --ignore RUSTSEC-2026-0370 \
          --ignore RUSTSEC-2026-0371 \
          --ignore RUSTSEC-2026-0372 \
          --ignore RUSTSEC-2026-0543
    - name: ci::run_documented_gate
      run: cargo xtask ci
    - name: ci::setup_ffmpeg
      run: cargo xtask setup-ffmpeg
    - name: ci::test_media_conversions
      run: cargo test --locked -p frame-core --test media_integration -- --ignored --test-threads=1
    - name: ci::test_app
      run: cargo test --locked -p frame-app --lib -- --test-threads=1
    - name: ci::test_conversion_runner
      run: cargo test --locked -p frame-app --lib conversion_runner -- --ignored --test-threads=1
    - name: ci::test_frame_export
      run: cargo test --locked -p frame-app --lib frame_export -- --ignored --test-threads=1
    - name: ci::test_app_package_pipeline
      run: cargo test --locked -p frame-app --features qa-harness --test qa_harness -- --include-ignored --test-threads=1
    timeout-minutes: 150
  cargo_check_macos:
    name: cargo check macos
    runs-on: macos-15
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
