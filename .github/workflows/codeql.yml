# Generated from xtask::workflows::codeql
# Rebuild with `cargo xtask workflows`.
name: codeql
on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '23 4 * * 3'
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: codeql rust
    runs-on: ubuntu-22.04
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: security::initialize_codeql
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: rust
        build-mode: none
        queries: security-extended
    - name: security::analyze_code
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: /language:rust
    timeout-minutes: 30
  analyze_website:
    name: codeql website
    runs-on: ubuntu-24.04
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: security::initialize_codeql_website
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: javascript-typescript
        build-mode: none
        queries: security-extended
        config: |
          paths:
            - website
    - name: security::analyze_website
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: /language:javascript-typescript/website
    timeout-minutes: 20
